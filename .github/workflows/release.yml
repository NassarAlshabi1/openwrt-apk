name: Build and publish APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release for this build
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'openwrt-manager' }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'openwrt-manager-release' }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'openwrt-manager-release' }}

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          keystore="$RUNNER_TEMP/signing/release.keystore"

          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            echo "Using the persistent keystore from ANDROID_KEYSTORE_BASE64."
          else
            keytool -genkeypair \
              -keystore "$keystore" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=OpenWrt Manager, OU=Android, O=OpenWrt Manager, L=Unknown, ST=Unknown, C=XX"
            echo "No ANDROID_KEYSTORE_BASE64 secret found; generated a temporary signing key for this release."
          fi

          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version_name"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v${version_name}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$apk"
          mkdir -p out
          cp "$apk" "out/openwrt-manager-${{ steps.version.outputs.name }}.apk"
          sha256sum out/*.apk > out/SHA256SUMS.txt
          du -h out/*.apk

      - name: Report APK size
        shell: bash
        run: |
          apk=$(find out -name '*.apk' -type f | head -n 1)
          size_bytes=$(stat -c '%s' "$apk")
          size_mb=$(awk "BEGIN { printf \"%.2f\", $size_bytes / 1048576 }")
          {
            echo "## APK size"
            echo "- File: $(basename \"$apk\")"
            echo "- Size: ${size_mb} MiB (${size_bytes} bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: OpenWrt Manager ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: false
          files: |
            out/*.apk
            out/SHA256SUMS.txt
